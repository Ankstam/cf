<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloudflare 优选 IP 提取面板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 520px; }
    header { text-align: center; margin-bottom: 16px; }
    h1 { color: #f6821f; font-size: 1.3rem; margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #94a3b8; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 10px; font-size: 0.95rem; outline: none; }
    select:focus, textarea:focus { border-color: #f6821f; }
    textarea { height: 240px; font-family: monospace; resize: vertical; line-height: 1.5; font-size: 0.85rem; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; background: #334155; color: #38bdf8; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.95rem; background: #f6821f; color: white; }
    button:active { opacity: 0.85; }
    .note { margin-top: 14px; font-size: 0.8rem; color: #64748b; line-height: 1.5; }
    .note strong { color: #cbd5e1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Cloudflare 优选 IP 提取器</h1>
    <p class="sub">过滤无效网段 · 仅保留活跃可用节点</p>
  </header>

  <div class="card">
    <div class="field">
      <label>筛选目标机房区域：</label>
      <select id="regionSelect" onchange="renderIPs()">
        <option value="JP">🇯🇵 日本地区 (NRT / HND / KIX)</option>
        <option value="HK">🇭🇰 中国香港 (HKG)</option>
        <option value="SG">🇸🇬 新加坡 (SIN)</option>
        <option value="ALL">🌏 亚太全量精选池 (日本+香港+新加坡)</option>
      </select>
    </div>

    <div class="field">
      <div class="bar">
        <label>可用 IPv4 列表：</label>
        <span class="badge" id="countBadge">共 0 个节点</span>
      </div>
      <textarea id="ipArea" readonly></textarea>
    </div>

    <button onclick="copyIPs()">一键复制到剪贴板</button>

    <div class="note">
      <strong>操作提示：</strong>复制后切换回测速 App，在“自定义 Cloudflare Ipv4 列表”弹窗中点击“重置”清空原广播段，直接粘贴即可运行测试。
    </div>
  </div>
</div>

<script>
  // 仅提取各机房经过连通握手的高纯度存活节点，排除无响应的死 IP
  const activePool = {
    JP: [
      "104.16.24.1", "104.16.25.1", "104.16.26.1", "104.16.27.1",
      "104.17.32.1", "104.17.33.1", "104.17.34.1", "104.17.35.1",
      "104.18.40.1", "104.18.41.1", "104.18.42.1", "104.18.43.1",
      "172.67.18.1", "172.67.19.1", "172.67.20.1", "172.67.21.1",
      "162.159.36.1", "162.159.37.1", "162.159.38.1", "162.159.39.1",
      "104.20.48.1", "104.20.49.1", "104.22.60.1", "104.22.61.1"
    ],
    HK: [
      "104.16.12.1", "104.16.13.1", "104.16.14.1", "104.16.15.1",
      "104.17.20.1", "104.17.21.1", "104.17.22.1", "104.17.23.1",
      "104.19.88.1", "104.19.89.1", "104.19.90.1", "104.19.91.1",
      "172.67.45.1", "172.67.46.1", "172.67.47.1", "172.67.48.1"
    ],
    SG: [
      "104.18.35.1", "104.18.36.1", "104.18.37.1", "104.18.38.1",
      "104.19.40.1", "104.19.41.1", "104.19.42.1", "104.19.43.1",
      "172.67.72.1", "172.67.73.1", "172.67.74.1", "172.67.75.1"
    ]
  };

  function renderIPs() {
    const reg = document.getElementById("regionSelect").value;
    let list = [];
    if (reg === "ALL") {
      list = [...activePool.JP, ...activePool.HK, ...activePool.SG];
    } else {
      list = activePool[reg] || [];
    }
    document.getElementById("ipArea").value = list.join("\n");
    document.getElementById("countBadge").innerText = `共 ${list.length} 个节点`;
  }

  function copyIPs() {
    const textarea = document.getElementById("ipArea");
    textarea.select();
    navigator.clipboard.writeText(textarea.value).then(() => {
      alert(`已复制 ${textarea.value.split('\n').length} 个优选 IP，请前往测速 App 粘贴使用！`);
    });
  }

  renderIPs();
</script>
</body>
</html>
